name: CodeQL

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
  push:
      branches: [ "master" ]
  schedule:
    # Weekly schedule
    - cron: '43 7 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: "Run CodeQL"
    uses: govuk-pay/pay-ci/.github/workflows/_run-codeql-scan.yml@8597f9957716cb928c22ed66ee0704a24798ce6e
    with:
      is_java_repo: true
